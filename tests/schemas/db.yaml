types:
  schema_files:
    - tests/schemas/account.gendb
    - tests/schemas/position.gendb
    - tests/schemas/config.gendb
    - tests/schemas/session.gendb
    - tests/schemas/order.gendb
  include_prefix: ""  # Optional prefix path for generated includes

options:
  cpp_namespace: "gendb::tests"

collections:

  - name: accounts
    type: gendb.tests.Account
    primary_key:
      - account_id

  - name: positions
    type: gendb.tests.Position
    primary_key:
      - position_id

  - name: configs
    type: gendb.tests.Config
    primary_key:
      - config_name

  - name: sessions
    type: gendb.tests.Session
    ephemeral: true
    primary_key:
      - session_id

  - name: orders
    type: gendb.tests.Order
    primary_key:
      - order_id

sequences:
  - name: account_id_sequence
    type: uint64
  - name: position_id_sequence
    type: int32

indices:
  - name: account_by_age
    collection: accounts
    fields:
      - age

  - name: position_by_account_id
    collection: positions
    fields:
      - account_id

  - name: position_by_account_and_instrument
    collection: positions
    fields:
      - account_id
      - instrument

  - name: account_by_address
    collection: accounts
    unique: true
    fields:
      - address
